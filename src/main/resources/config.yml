infusion_blocks:
    - enchanting_table
location_specific: false
locations:
    - -2590,134,-5321

infusion_item: loot.infusion_token

# d20 rolls, like /roll: a d20 plus a modifier from the player's base attribute (gear does not count).
# A natural 20 always gives the best result and a natural 1 always the worst, whatever the modifier.
d20:
  # Base attribute value -> modifier. Same as RPCharacters rolls.yml; values past the ends use the nearest end.
  attribute-modifiers:
    0: -5
    1: -5
    2: -4
    3: -4
    4: -3
    5: -3
    6: -2
    7: -2
    8: -1
    9: -1
    10: 0
    11: 0
    12: 1
    13: 1
    14: 2
    15: 2
    16: 3
    17: 3
    18: 4
    19: 4
    20: 5
  # Infusion: each gem's roll picks its stat after its rarity is drawn. The roll is not shown to the player.
  infusion:
    attribute: intelligence
    # A total of 1 or less gives the bottom of the spread, this total or more the top (a Flawless gem).
    flawless-dc: 20
    # How far the spread reaches past each rarity's min and max, in percent.
    spread-percent: 20
    # A gem is named after how its stat ranks among every result it could have rolled, not after the drawn
    # rarity, so a better name never means a weaker gem. Each name goes to the same share of results as its
    # rarity's chance, worked out for this d20 modifier (0 is Intelligence 10-11 in the table above); players
    # above it get better names more often. Results that tie on one stat share a name, and a tie that would
    # push a rarer name past its chance gets the lower name, so rarer names can fall slightly short.
    # The cutoffs for each gem are logged when the config loads.
    name-reference-modifier: 0
  # Goldsmithing: one craft roll when a gem piece is finished. It only moves the jewelry stat and is not
  # shown to the player. The quality, Masterwork included, comes from the recipe and hits alone.
  goldsmithing:
    attribute: dexterity
    # Jewelry stat change for each point of the total above or below 10, and its cap, in percent.
    percent-per-point: 2
    max-percent: 20
  # Dev testing only: 1-20 makes every roll that natural number. 0 rolls for real.
  force-natural: 0

# List rarities from lowest to highest. chance is how often each is drawn, and also the share of gems
# named after it.
rarities:
    common:
        name: "§aCommon"
        chance: 65
    rare:
        name: "§9Rare"
        chance: 25
    epic:
        name: "§5Epic"
        chance: 7
    legendary:
        name: "§6Legendary"
        chance: 3
        announce: true

# Stat ranges for each rarity, shared by gems that roll the same numbers. Each range is min-max,
# before the d20 spread.
stat-bands:
    tier-1:
        common: 1.00-1.20
        rare: 1.30-1.50
        epic: 1.60-1.80
        legendary: 1.90-2.00
    tier-2:
        common: 2.00-2.20
        rare: 2.30-2.50
        epic: 2.60-2.80
        legendary: 2.90-3.00
    tier-3:
        common: 3.00-3.20
        rare: 3.30-3.50
        epic: 3.60-3.80
        legendary: 3.90-4.00
    tier-4:
        common: 4.00-4.20
        rare: 4.30-4.50
        epic: 4.60-4.80
        legendary: 4.90-5.00
    tier-5:
        common: 5.00-5.20
        rare: 5.30-5.50
        epic: 5.60-5.80
        legendary: 5.90-6.00

